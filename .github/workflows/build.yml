name: build

# Default to 'contents: read', which grants actions to read commits.
#
# If any permission is set, any permission not included in the list is
# implicitly set to "none".
#
# see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

env:
  VERSION: ${{ github.ref }}

on:
  workflow_dispatch:
  
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake cross --print | jq -cr '.target."cross".platforms')" >>${GITHUB_OUTPUT}
      -
        name: Show matrix
        run: |
          echo ${{ steps.platforms.outputs.matrix }}

  build:
    runs-on: ubuntu-24.04
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          - binary
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
        use_glibc:
          - glibc
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build
        uses: docker/bake-action@v6
        with:
          targets: "binary"
          set: |
            *.platform="linux/amd64"
        env:
          USE_GLIBC: "glibc"
      -
        name: Create tarball
        working-directory: ./build
        run: |
          mkdir tmp/out/
          platform="linux/amd64"
          platformPair=${platform//\//-}
          tar -cvzf "/tmp/out/docker-${platformPair}.tar.gz" .
          if [ -z "glibc" ]; then
            echo "ARTIFACT_NAME="linux/amd64"-${platformPair}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME="linux/amd64"-${platformPair}-glibc" >> $GITHUB_ENV
          fi
      -
        name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lw_ARTIFACT_NAME
          path: /tmp/out/*
          if-no-files-found: error
